name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest

  docker:
    runs-on: ubuntu-latest
    needs: pytest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t linklab .
      - name: Smoke test the container
        run: |
          docker run -d --name linklab -p 8000:8000 linklab
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/health && break; sleep 1; done
          code=$(curl -fsS -X POST http://localhost:8000/shorten \
            -H 'Content-Type: application/json' \
            -d '{"url":"https://example.com/ci","custom_alias":"ci-check"}' | python3 -c 'import sys, json; print(json.load(sys.stdin)["short_code"])')
          test "$code" = "ci-check"
          test "$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' http://localhost:8000/ci-check)" = "307 https://example.com/ci"
          curl -fsS http://localhost:8000/ | grep -q LinkLab
      - name: Container logs
        if: always()
        run: docker logs linklab || true
